<!--
  ZenTrades Early Access — top-of-nav announcement bar
  ------------------------------------------------------------
  Paste this WHOLE block wherever your theme lets you add HTML
  right above (or at the top of) the navigation — a header hook,
  a "before nav" widget area, or the same Custom HTML/CSS/JS spot
  as the main popup, placed above it.

  It calls window.ZTEAOpenPopup() when clicked, which comes from
  the main popup snippet (zentrades-early-access-popup.html) — make
  sure that snippet is present on the page too, or the button won't
  do anything.
-->
<div id="ztea-topbar" role="region" aria-label="Early access announcement">
    <div class="ztea-topbar-inner">
        <span class="ztea-topbar-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M12 8V2M12 2L9 5M12 2l3 3" stroke="#fff" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <rect x="3" y="8" width="18" height="13" rx="2" stroke="#fff" stroke-width="2" />
                <path d="M3 13h18" stroke="#fff" stroke-width="2" />
            </svg>
        </span>
        <span class="ztea-topbar-text">Labor Day early access is open — limited seats for trade contractors.</span>
        <button type="button" class="ztea-topbar-cta">Get early access</button>
    </div>
    <button type="button" class="ztea-topbar-dismiss" aria-label="Dismiss announcement">&times;</button>
</div>

<style>
    #ztea-topbar {
        position: relative !important;
        width: 100% !important;
        box-sizing: border-box !important;
        background: linear-gradient(90deg, #e0616b, #c94b56) !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    }

    .ztea-topbar-inner {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-wrap: wrap !important;
        gap: 10px 14px !important;
        max-width: 1080px !important;
        margin: 0 auto !important;
        padding: 10px 46px !important;
    }

    .ztea-topbar-icon {
        display: flex !important;
        flex-shrink: 0 !important;
        opacity: 0.9 !important;
    }

    .ztea-topbar-text {
        color: #fff !important;
        font-size: 13.5px !important;
        font-weight: 600 !important;
        line-height: 1.4 !important;
        letter-spacing: 0.01em !important;
    }

    .ztea-topbar-cta {
        background: #fff !important;
        color: #c94b56 !important;
        border: none !important;
        font-size: 12.5px !important;
        font-weight: 700 !important;
        padding: 7px 16px !important;
        border-radius: 999px !important;
        cursor: pointer !important;
        white-space: nowrap !important;
        transition: transform 0.15s ease, box-shadow 0.15s ease !important;
    }

    .ztea-topbar-cta:hover {
        transform: translateY(-1px) !important;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18) !important;
    }

    .ztea-topbar-dismiss {
        position: absolute !important;
        right: 10px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        width: 26px !important;
        height: 26px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: transparent !important;
        border: none !important;
        color: #fff !important;
        opacity: 0.75 !important;
        font-size: 18px !important;
        line-height: 1 !important;
        cursor: pointer !important;
        border-radius: 6px !important;
        padding: 0 !important;
    }

    .ztea-topbar-dismiss:hover {
        opacity: 1 !important;
        background: rgba(255, 255, 255, 0.15) !important;
    }

    @media (max-width: 560px) {
        .ztea-topbar-inner {
            padding: 10px 40px !important;
            gap: 8px 12px !important;
        }

        .ztea-topbar-text {
            font-size: 12.5px !important;
        }
    }
</style>

<script>
    (function () {
        var bar = document.getElementById("ztea-topbar");
        if (!bar) return;

        if (sessionStorage.getItem("ztea_topbar_dismissed")) {
            bar.style.display = "none";
            return;
        }

        bar.querySelector(".ztea-topbar-cta").addEventListener("click", function () {
            if (typeof window.ZTEAOpenPopup === "function") {
                window.ZTEAOpenPopup();
            }
        });

        bar.querySelector(".ztea-topbar-dismiss").addEventListener("click", function () {
            bar.style.display = "none";
            sessionStorage.setItem("ztea_topbar_dismissed", "1");
        });
    })();
</script>
